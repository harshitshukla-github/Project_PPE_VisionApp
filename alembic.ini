# Alembic configuration, for writing new migrations from the command line:
#
#     uv run alembic revision --autogenerate -m "describe the change"
#
# Applying migrations is `uv run python cli.py db migrate`, which builds this
# configuration in code (src/db/migrate.py). The database URL is never set
# here: env.py reads DATABASE_URL from .env.

[alembic]
script_location = %(here)s/src/db/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s
