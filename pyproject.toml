[project]
name = "project-ppe-visionapp"
version = "0.1.0"
description = "PPB Vision Module — AI-powered PPE compliance detection using dual YOLO pipeline"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    # Core YOLO (ships YOLO26 + YOLO11)
    "ultralytics>=8.4.0",
    # Deep learning backend
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    # Computer vision & image processing
    "opencv-python-headless>=4.9.0",
    "Pillow>=10.2.0",
    "albumentations>=1.4.0",
    # Dataset management
    "roboflow>=1.1.0",
    "kaggle>=1.6.0",
    "supervision>=0.21.0",
    "pycocotools>=2.0.7",
    # Experiment tracking & visualization
    "mlflow>=2.12.0",
    "tensorboard>=2.16.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    # Model export
    "onnx>=1.16.0",
    "onnxruntime>=1.17.0",
    # FastAPI serving
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    # Gemini hybrid pipeline
    "google-genai>=1.0.0",
    # Config & utilities
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0.1",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "loguru>=0.7.0",
    # Testing & code quality
    "pytest>=8.1.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    # Jupyter
    "jupyterlab>=4.1.0",
    "ipywidgets>=8.1.0",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu124", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "PLC"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
# Excluded from unit coverage: modules whose core paths need the network
# (Roboflow/Kaggle downloads), a GPU + real weights (training loop), or
# multi-GB datasets (remap/split/validate). These are exercised by the real
# pipeline runs (cli data pipeline / cli train) rather than unit tests.
omit = [
    "src/data/downloader.py",
    "src/data/remapper.py",
    "src/data/splitter.py",
    "src/data/validator.py",
    "src/training/trainer.py",
    "src/training/callbacks.py",
    # Alembic migration scripts: tests/test_db_matrix.py runs them and checks
    # they match the models, which line coverage cannot measure.
    "src/db/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "def main\\(",
]
